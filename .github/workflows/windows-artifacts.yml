name: Windows Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "cursor/**"
  pull_request:
    branches:
      - main

jobs:
  build-windows-executables:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Build server and client
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVMS_BUILD_TESTS=OFF -DCMAKE_CXX_COMPILER=g++
          cmake --build build --parallel

      - name: Collect executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "build/modules/server/vms_server.exe" "artifacts/vms_server.exe"
          Copy-Item "build/modules/client/vms_client.exe" "artifacts/vms_client.exe"
          $dllSource = "C:\msys64\mingw64\bin"
          $dlls = @("libgcc_s_seh-1.dll", "libwinpthread-1.dll", "libstdc++-6.dll")
          foreach ($dll in $dlls) {
            $sourcePath = Join-Path $dllSource $dll
            if (Test-Path $sourcePath) {
              Copy-Item $sourcePath (Join-Path "artifacts" $dll) -Force
            }
          }

      - name: Upload server/client artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-vms-windows-executables
          path: artifacts/
