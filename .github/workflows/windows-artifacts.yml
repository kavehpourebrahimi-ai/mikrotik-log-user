name: Windows Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "cursor/**"
  pull_request:
    branches:
      - main

jobs:
  build-windows-executables:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-sqlite3

      - name: Build server and client
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVMS_BUILD_TESTS=OFF -DCMAKE_CXX_COMPILER=g++
          cmake --build build --parallel

      - name: Collect runtime DLL dependencies
        shell: msys2 {0}
        run: |
          mkdir -p runtime-dlls

          collect_deps() {
            local exe="$1"
            local queue=()
            local visited_file="runtime-dlls/.visited.txt"
            touch "${visited_file}"

            while IFS= read -r dep; do
              [[ -n "${dep}" ]] && queue+=("${dep}")
            done < <(objdump -p "${exe}" | awk '/DLL Name:/ {print $3}')

            while ((${#queue[@]})); do
              local dll="${queue[0]}"
              queue=("${queue[@]:1}")

              if grep -Fxq "${dll}" "${visited_file}"; then
                continue
              fi
              echo "${dll}" >> "${visited_file}"

              local source="/mingw64/bin/${dll}"
              if [[ -f "${source}" ]]; then
                cp -f "${source}" runtime-dlls/
                while IFS= read -r child; do
                  [[ -n "${child}" ]] && queue+=("${child}")
                done < <(objdump -p "${source}" | awk '/DLL Name:/ {print $3}')
              fi
            done
          }

          collect_deps "build/modules/server/vms_server.exe"
          collect_deps "build/modules/client/vms_client.exe"

      - name: Collect executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "build/modules/server/vms_server.exe" "artifacts/vms_server.exe"
          Copy-Item "build/modules/client/vms_client.exe" "artifacts/vms_client.exe"
          if (Test-Path "runtime-dlls") {
            Copy-Item "runtime-dlls\*.dll" "artifacts\" -Force -ErrorAction SilentlyContinue
          }
          New-Item -ItemType Directory -Force -Path "windows-dist/EnterpriseVMS/bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "windows-dist/EnterpriseVMS/config" | Out-Null
          New-Item -ItemType Directory -Force -Path "windows-dist/EnterpriseVMS/scripts" | Out-Null
          Copy-Item "artifacts/vms_server.exe" "windows-dist/EnterpriseVMS/bin/vms_server.exe" -Force
          Copy-Item "artifacts/vms_client.exe" "windows-dist/EnterpriseVMS/bin/vms_client.exe" -Force
          Copy-Item "artifacts\*.dll" "windows-dist/EnterpriseVMS/bin\" -Force -ErrorAction SilentlyContinue
          Copy-Item "packaging/windows/config/vms-server.conf" "windows-dist/EnterpriseVMS/config/vms-server.conf" -Force
          Copy-Item "packaging/windows/scripts/start-server.cmd" "windows-dist/EnterpriseVMS/scripts/start-server.cmd" -Force
          Copy-Item "packaging/windows/scripts/start-client.cmd" "windows-dist/EnterpriseVMS/scripts/start-client.cmd" -Force
          Copy-Item "packaging/windows/scripts/start-web-ui.cmd" "windows-dist/EnterpriseVMS/scripts/start-web-ui.cmd" -Force
          Copy-Item "packaging/windows/scripts/install-service.cmd" "windows-dist/EnterpriseVMS/scripts/install-service.cmd" -Force
          Copy-Item "packaging/windows/scripts/uninstall-service.cmd" "windows-dist/EnterpriseVMS/scripts/uninstall-service.cmd" -Force
          Copy-Item "packaging/windows/README-WINDOWS.txt" "windows-dist/EnterpriseVMS/README-WINDOWS.txt" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "windows-dist/installer" | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=0.2.0" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\windows-dist\EnterpriseVMS" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\windows-dist\installer" `
            "$env:GITHUB_WORKSPACE\scripts\windows\EnterpriseVmsSetup.iss"
          Copy-Item "windows-dist/installer/EnterpriseVmsSetup.exe" "artifacts/EnterpriseVmsSetup.exe" -Force

      - name: Upload server/client artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-vms-windows-executables
          path: artifacts/
