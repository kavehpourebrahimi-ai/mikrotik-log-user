; VMS Mobile Bridge configuration.
; Copy to config.ini and edit, then run start.bat

[server]
host = 0.0.0.0
port = 8080

[tools]
; ffmpeg_bin = C:\ffmpeg\bin\ffmpeg.exe
; ffprobe_bin = C:\ffmpeg\bin\ffprobe.exe

[db]
host = 127.0.0.1
port = 34176
user = root
password = root
name = surveillancesystem

[archive]
record_root = E:\VMS\Record

[live]
rtsp_port = 554
; Main / Sub stream paths (Longse: /0 and /1)
rtsp_template = rtsp://{user}:{password}@{ip}:{port}/0
rtsp_template_sub = rtsp://{user}:{password}@{ip}:{port}/1
; ONVIF auto-discovery (recommended) — finds RTSP URL per camera from DB credentials
use_onvif = true
; Multi-camera grid uses sub stream snapshots (lower bandwidth)
grid_stream = sub
; Server only repackages video — client decodes HEVC (low CPU)
copy_codec = true

[playback]
copy_codec = true
