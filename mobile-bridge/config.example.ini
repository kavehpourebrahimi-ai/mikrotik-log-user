; VMS Mobile Bridge configuration.
; Copy this file to "config.ini" and adjust for your server, then run app.py.

[server]
; Interface/port the mobile web app is served on.
host = 0.0.0.0
port = 8080

[tools]
; If ffmpeg/ffprobe are not on PATH (common on Windows), set full paths here:
; ffmpeg_bin = C:\ffmpeg\bin\ffmpeg.exe
; ffprobe_bin = C:\ffmpeg\bin\ffprobe.exe

[db]
; The VMS MySQL database (defaults match the bundled VMS installation).
host = 127.0.0.1
port = 34176
user = root
password = root
name = surveillancesystem

[archive]
; Root folder where the VMS StreamServer writes recordings.
record_root = E:\VMS\Record

[live]
; RTSP service port (kept separate from the device HTTP/ONVIF port in the DB).
rtsp_port = 554
; RTSP URL template used to pull each camera THROUGH the server.
; Placeholders: {user} {password} {ip} {port}=rtsp_port {http_port} {channel} {channel0}
; These are ONVIF cameras; common ONVIF/Longse RTSP forms
; (use probe_rtsp.py to find the right one for your model):
;   rtsp://{user}:{password}@{ip}:{port}/av0_0
;   rtsp://{user}:{password}@{ip}:{port}/11
;   rtsp://{user}:{password}@{ip}:{port}/live/main
;   rtsp://{user}:{password}@{ip}:{port}/cam/realmonitor?channel={channel}&subtype=0
;   rtsp://{user}:{password}@{ip}:{port}/onvif1
rtsp_template = rtsp://{user}:{password}@{ip}:{port}/av0_0
; copy_codec=false transcodes HEVC->H.264 for browser compatibility (recommended).
; Set true only if your clients can decode HEVC (less CPU, limited support).
copy_codec = false

[playback]
; Same idea for archive playback (HEVC .vdo -> H.264 mp4 by default).
copy_codec = false
